name: Publish Short to YouTube

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct stream URL of the Short'
        required: false
        default: 'https://n.uguu.se/ssEHaavH.mp4'
      title:
        description: 'YouTube Short Title'
        required: false
        default: "Gary's Tactical Barnyard Prison Break! 🐔🍷 #Shorts"

jobs:
  upload-youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Publish to YouTube Shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_to_youtube.py --video "${{ github.event.inputs.video_url }}" --title "${{ github.event.inputs.title }}"
