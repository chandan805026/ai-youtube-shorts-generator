name: Publish Short to YouTube

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct stream URL of the Short'
        required: true
        default: 'https://d.uguu.se/jFmhgjql.mp4'
      title:
        description: 'YouTube Short Title'
        required: true
        default: 'Bro Really Thought He Could Escape! 💨😂 #Shorts'
      desc:
        description: 'YouTube Short Description'
        required: false
        default: ''
      publish_at:
        description: 'Scheduled Publish Time (ISO 8601 UTC, e.g. 2026-10-09T21:00:00.000Z for 2:30 AM IST)'
        required: false
        default: ''

jobs:
  upload-youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Publish to YouTube Shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          ARGS="--video '${{ github.event.inputs.video_url }}' --title '${{ github.event.inputs.title }}'"
          if [ -n "${{ github.event.inputs.desc }}" ]; then
            ARGS="$ARGS --desc '${{ github.event.inputs.desc }}'"
          fi
          if [ -n "${{ github.event.inputs.publish_at }}" ]; then
            ARGS="$ARGS --publish-at '${{ github.event.inputs.publish_at }}'"
          fi
          eval python upload_to_youtube.py $ARGS
