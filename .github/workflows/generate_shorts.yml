name: Generate Viral Comedy Short

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Kuaishou Video URL or Photo ID'
        required: true
        default: 'https://v.kuaishou.com/JRJh6WE1'
      start_time:
        description: 'Optional Start Time (seconds)'
        required: false
        default: ''
      end_time:
        description: 'Optional End Time (seconds)'
        required: false
        default: ''

jobs:
  build-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup FFmpeg
        run: |
          which ffmpeg || sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Fonts for Subtitles
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu fonts-liberation fontconfig

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gemini 1:1 Story + 1.15x Locked Sync Shorts Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_KEYS_POOL: ${{ secrets.ELEVENLABS_KEYS_POOL }}
        run: |
          CMD="python pipeline.py --url '${{ github.event.inputs.video_url }}'"
          if [ -n "${{ github.event.inputs.start_time }}" ]; then
            CMD="$CMD --start ${{ github.event.inputs.start_time }}"
          fi
          if [ -n "${{ github.event.inputs.end_time }}" ]; then
            CMD="$CMD --end ${{ github.event.inputs.end_time }}"
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Upload Generated Short as Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viral-short-preview
          path: viral_short_*.mp4
          retention-days: 7

      - name: Generate Direct Online Streaming Link
        run: |
          SHORT_FILE=$(ls viral_short_*.mp4 | head -n 1)
          echo "Found generated video: $SHORT_FILE ($(du -h $SHORT_FILE | cut -f1))"
          
          TMP_RESP=$(curl -s -H "User-Agent: Mozilla/5.0" -F "file=@$SHORT_FILE" https://tmpfiles.org/api/v1/upload || true)
          echo "Tmpfiles response: $TMP_RESP"
          
          STREAM_URL=$(python3 -c "import json, sys; res = json.loads('''$TMP_RESP'''); url = res.get('data', {}).get('url', ''); print(url.replace('tmpfiles.org/', 'tmpfiles.org/dl/'))" 2>/dev/null || echo "")
          echo "DIRECT_STREAM_URL=$STREAM_URL" >> $GITHUB_ENV
          
          UGUU_RESP=$(curl -s -F "files[]=@$SHORT_FILE" https://uguu.se/upload.php || true)
          echo "Uguu response: $UGUU_RESP"
          UGUU_URL=$(python3 -c "import json, sys; res = json.loads('''$UGUU_RESP'''); print(res.get('files', [{}])[0].get('url', ''))" 2>/dev/null || echo "")
          echo "UGUU_STREAM_URL=$UGUU_URL" >> $GITHUB_ENV
          
          echo "=========================================================="
          echo "  DIRECT STREAMING URL: $STREAM_URL"
          echo "  BACKUP STREAMING URL: $UGUU_URL"
          echo "=========================================================="
