name: Generate YouTube Short (Cloud Video Maker)

on:
  schedule:
    # 2x Daily Automatic Runs at US Peak Traffic Times:
    # 13:30 UTC = 7:00 PM IST = 9:30 AM EST (US Morning Commute / Coffee break)
    - cron: '30 13 * * *'
    # 22:30 UTC = 4:00 AM IST = 6:30 PM EST (US Evening Prime YouTube watching hour)
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      auto_pilot:
        description: '🤖 Auto-Pilot Mode (Gemini 3.6 Flash writes script & directs)'
        type: boolean
        required: true
        default: true
      topic:
        description: 'Mystery / Video Topic'
        required: false
        default: 'deep space cosmic mystery'
      script:
        description: '(Optional) Custom Script text (Leave empty to let Gemini create)'
        required: false
        default: ''
      voice:
        description: 'Select Voiceover Voice'
        required: false
        default: 'en-US-ChristopherNeural'
        type: choice
        options:
          - 'en-US-ChristopherNeural'
          - 'en-US-GuyNeural'
          - 'en-US-JennyNeural'
          - 'en-US-EricNeural'
          - 'hi-IN-MadhurNeural'
          - 'hi-IN-SwaraNeural'

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎬 Install FFmpeg and Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-liberation

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run AI Video Generator with Gemini 3.6 Flash Director
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ "${{ inputs.auto_pilot }}" = "false" ] && [ -n "${{ inputs.script }}" ]; then
            echo "🎬 Running in Custom Script mode..."
            python generate_video.py \
              --script "${{ inputs.script }}" \
              --voice "${{ inputs.voice || 'en-US-ChristopherNeural' }}" \
              --topic "${{ inputs.topic || 'deep space mystery' }}" \
              --output "output/final_video.mp4" \
              --thumb "output/thumbnail.jpg"
          else
            echo "🧠 Running in 100% Auto-Pilot mode with Gemini 3.6 Flash Director..."
            python generate_video.py \
              --auto \
              --voice "en-US-ChristopherNeural" \
              --topic "${{ inputs.topic || 'deep space cosmic mystery' }}" \
              --output "output/final_video.mp4" \
              --thumb "output/thumbnail.jpg"
          fi

      - name: 🌐 Prepare Web Player (Anti-Cache)
        run: |
          mkdir -p web
          cp output/final_video.mp4 web/video.mp4
          cp output/thumbnail.jpg web/thumbnail.jpg
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          RUN_ID="${{ github.run_id }}"
          
          # Read video title from metadata if available
          VIDEO_TITLE="AI Space Mystery Short"
          if [ -f "output/metadata.json" ]; then
            VIDEO_TITLE=$(python -c "import json; print(json.load(open('output/metadata.json')).get('title', 'AI Space Mystery Short'))")
          fi
          
          cat << EOF > web/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
            <meta http-equiv="Pragma" content="no-cache">
            <meta http-equiv="Expires" content="0">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${VIDEO_TITLE}</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                background: #0d0e12;
                color: #f1f1f1;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 16px;
              }
              .container {
                max-width: 420px;
                width: 100%;
                text-align: center;
                background: #181920;
                border-radius: 20px;
                padding: 20px;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
                border: 1px solid #282a36;
              }
              h1 { font-size: 1.2rem; margin-bottom: 4px; color: #fff; line-height: 1.3; }
              p.subtitle { font-size: 0.8rem; color: #10b981; font-weight: bold; margin-bottom: 14px; }
              .video-wrapper {
                position: relative;
                border-radius: 16px;
                overflow: hidden;
                background: #000;
                box-shadow: 0 8px 24px rgba(0,0,0,0.6);
                margin-bottom: 18px;
              }
              video { width: 100%; max-height: 70vh; display: block; border-radius: 16px; }
              .actions { display: flex; flex-direction: column; gap: 10px; }
              .btn {
                display: inline-block;
                padding: 12px 20px;
                font-size: 0.95rem;
                font-weight: 600;
                border-radius: 10px;
                text-decoration: none;
                cursor: pointer;
              }
              .btn-download { background: #e50914; color: white; }
              .btn-create { background: #2563eb; color: white; }
              .footer { margin-top: 14px; font-size: 0.72rem; color: #6b7280; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>${VIDEO_TITLE}</h1>
              <p class="subtitle">✅ Directed by Gemini 3.6 Flash • ${BUILD_TIME}</p>
              <div class="video-wrapper">
                <video controls autoplay loop playsinline poster="thumbnail.jpg?v=${RUN_ID}" src="video.mp4?v=${RUN_ID}"></video>
              </div>
              <div class="actions">
                <a href="video.mp4?v=${RUN_ID}" download="youtube_short.mp4" class="btn btn-download">⬇️ Download Video (.mp4)</a>
                <a href="https://github.com/chandan805026/ai-youtube-shorts-generator/actions" target="_blank" class="btn btn-create">⚡ Generate Another Video</a>
              </div>
              <p class="footer">Cloud Rendered via GitHub Actions • Run #${RUN_ID}</p>
            </div>
          </body>
          </html>
          EOF

      - name: 🚀 Publish Live to GitHub Pages (Anti-Cache)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: false

      - name: 📢 Print Watch Online Link in Summary
        run: |
          echo "## 🎉 Gemini 3.6 Flash Video Ready!" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 [Click Here to Watch Online (Anti-Cache)](https://chandan805026.github.io/ai-youtube-shorts-generator/?v=${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: 💾 Upload Video and Metadata as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final_youtube_short
          path: |
            output/final_video.mp4
            output/thumbnail.jpg
            output/metadata.json
          retention-days: 7
