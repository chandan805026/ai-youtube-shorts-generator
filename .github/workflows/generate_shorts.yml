name: Generate Viral Comedy Short

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Kuaishou Video URL or Photo ID'
        required: true
        default: 'https://c.kuaishou.com/fw/photo/3xhpefxgm7t4c7k'

jobs:
  build-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Pre-installed FFmpeg
        run: ffmpeg -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TwelveLabs + Gemini Autonomous Shorts Pipeline
        env:
          TWELVELABS_API_KEY: ${{ secrets.TWELVELABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_KEYS_POOL: ${{ secrets.ELEVENLABS_KEYS_POOL }}
        run: |
          python pipeline.py --url "${{ github.event.inputs.video_url }}"

      - name: Upload Generated Short as Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viral-short-preview
          path: viral_short_*.mp4
          retention-days: 7
