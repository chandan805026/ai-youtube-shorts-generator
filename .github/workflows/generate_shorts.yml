name: Generate Viral Comedy Short

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Kuaishou Video URL or Photo ID'
        required: true
        default: 'https://c.kuaishou.com/fw/photo/3xhpefxgm7t4c7k'

jobs:
  build-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup FFmpeg (Fast Static Binary)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Install Fonts for Subtitles
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu fontconfig

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run TwelveLabs + ElevenLabs Autonomous Shorts Pipeline
        env:
          TWELVELABS_API_KEY: ${{ secrets.TWELVELABS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_KEYS_POOL: ${{ secrets.ELEVENLABS_KEYS_POOL }}
        run: |
          python pipeline.py --url "${{ github.event.inputs.video_url }}"

      - name: Upload Generated Short as Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viral-short-preview
          path: viral_short_*.mp4
          retention-days: 7

      - name: Generate Direct Online Streaming Link
        run: |
          SHORT_FILE=$(ls viral_short_*.mp4 | head -n 1)
          echo "Found generated video: $SHORT_FILE ($(du -h $SHORT_FILE | cut -f1))"
          
          TMP_RESP=$(curl -s -H "User-Agent: Mozilla/5.0" -F "file=@$SHORT_FILE" https://tmpfiles.org/api/v1/upload || true)
          echo "Tmpfiles response: $TMP_RESP"
          
          STREAM_URL=$(python3 -c "import json, sys; d=json.loads(sys.argv[1]); u=d.get('data',{}).get('url',''); print(u.replace('tmpfiles.org/', 'tmpfiles.org/dl/'))" "$TMP_RESP" 2>/dev/null || true)
          WEB_PLAYER_URL=$(python3 -c "import json, sys; d=json.loads(sys.argv[1]); print(d.get('data',{}).get('url',''))" "$TMP_RESP" 2>/dev/null || true)
          
          UGUU_RESP=$(curl -s -H "User-Agent: Mozilla/5.0" -F "files[]=@$SHORT_FILE" https://uguu.se/upload || true)
          echo "Uguu response: $UGUU_RESP"
          UGUU_URL=$(python3 -c "import json, sys; d=json.loads(sys.argv[1]); print(d.get('files',[{}])[0].get('url',''))" "$UGUU_RESP" 2>/dev/null || true)

          echo "=========================================================="
          echo "ONLINE_WEB_PLAYER_URL=$WEB_PLAYER_URL"
          echo "ONLINE_STREAM_URL=$STREAM_URL"
          echo "ONLINE_BACKUP_STREAM_URL=$UGUU_URL"
          echo "=========================================================="
          
          echo "### 🎬 Direct Online Video Links" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Player (Interactive Player)**: [$WEB_PLAYER_URL]($WEB_PLAYER_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Stream URL**: [$STREAM_URL]($STREAM_URL)" >> $GITHUB_STEP_SUMMARY
          if [ -n "$UGUU_URL" ]; then
            echo "- **Backup Direct Stream**: [$UGUU_URL]($UGUU_URL)" >> $GITHUB_STEP_SUMMARY
          fi

