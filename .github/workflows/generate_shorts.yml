name: Generate YouTube Short (Cloud Video Maker)

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Enter Video Script (100% US English or Hindi)'
        required: true
        default: 'Did you know that if you fell into a black hole, time for the outside universe would speed up to infinity? You would literally witness the entire future of the cosmos flash before your eyes in a single second.'
      voice:
        description: 'Select Voiceover Voice'
        required: true
        default: 'en-US-ChristopherNeural (Deep US Narrator - Best for Facts/Mystery)'
        type: choice
        options:
          - 'en-US-ChristopherNeural (Deep US Narrator - Best for Facts/Mystery)'
          - 'en-US-GuyNeural (Energetic US Male - Best for News/Tech)'
          - 'en-US-JennyNeural (Natural US Female Voice)'
          - 'en-US-EricNeural (Calm US Male Voice)'
          - 'hi-IN-MadhurNeural (Hindi Male RJ Voice)'
          - 'hi-IN-SwaraNeural (Hindi Female Voice)'
      topic:
        description: 'Background Visual Theme'
        required: true
        default: 'space'
        type: choice
        options:
          - 'space'
          - 'galaxy'
          - 'dark mystery'
          - 'technology'
          - 'future city'
          - 'nature'
          - 'ocean'
          - 'finance'
      color:
        description: 'Subtitle Color'
        required: true
        default: 'Yellow'
        type: choice
        options:
          - 'Yellow'
          - 'White'
          - 'Cyan'
          - 'Green'
      pexels_api_key:
        description: '(Optional) Pexels Free API Key'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🎬 Install FFmpeg and Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu fonts-liberation

      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run AI Video Generator
        run: |
          python generate_video.py \
            --script "${{ inputs.script }}" \
            --voice "${{ inputs.voice }}" \
            --topic "${{ inputs.topic }}" \
            --color "${{ inputs.color }}" \
            --pexels_key "${{ inputs.pexels_api_key }}" \
            --output "output/final_video.mp4"

      - name: 🌐 Prepare Web Player
        run: |
          mkdir -p web
          cp output/final_video.mp4 web/video.mp4
          cat << 'EOF' > web/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AI YouTube Shorts Player</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                background: #0d0e12;
                color: #f1f1f1;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 16px;
              }
              .container {
                max-width: 420px;
                width: 100%;
                text-align: center;
                background: #181920;
                border-radius: 20px;
                padding: 20px;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
                border: 1px solid #282a36;
              }
              h1 { font-size: 1.3rem; margin-bottom: 6px; color: #fff; }
              p.subtitle { font-size: 0.85rem; color: #9da3af; margin-bottom: 16px; }
              .video-wrapper {
                position: relative;
                border-radius: 16px;
                overflow: hidden;
                background: #000;
                box-shadow: 0 8px 24px rgba(0,0,0,0.6);
                margin-bottom: 18px;
              }
              video { width: 100%; max-height: 70vh; display: block; border-radius: 16px; }
              .actions { display: flex; flex-direction: column; gap: 10px; }
              .btn {
                display: inline-block;
                padding: 12px 20px;
                font-size: 0.95rem;
                font-weight: 600;
                border-radius: 10px;
                text-decoration: none;
                cursor: pointer;
              }
              .btn-download { background: #e50914; color: white; }
              .btn-create { background: #2563eb; color: white; }
              .footer { margin-top: 14px; font-size: 0.75rem; color: #6b7280; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🎬 AI Video Preview</h1>
              <p class="subtitle">Cloud Rendered via GitHub Actions • 1080x1920</p>
              <div class="video-wrapper">
                <video controls autoplay loop playsinline src="video.mp4"></video>
              </div>
              <div class="actions">
                <a href="video.mp4" download="youtube_short.mp4" class="btn btn-download">⬇️ Download Video (.mp4)</a>
                <a href="https://github.com/chandan805026/ai-youtube-shorts-generator/actions" target="_blank" class="btn btn-create">⚡ Generate Another Video</a>
              </div>
              <p class="footer">Powered by Microsoft EdgeTTS • Zero Laptop Load</p>
            </div>
          </body>
          </html>
          EOF

      - name: 🚀 Publish Live to GitHub Pages (Watch Online Link)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          keep_files: false

      - name: 📢 Print Watch Online Link in Summary
        run: |
          echo "## 🎉 Your Video is Ready!" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 [Click Here to Watch Video Online Instantly](https://chandan805026.github.io/ai-youtube-shorts-generator/)" >> $GITHUB_STEP_SUMMARY

      - name: 💾 Upload Video as Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: final_youtube_short
          path: output/final_video.mp4
          retention-days: 7
